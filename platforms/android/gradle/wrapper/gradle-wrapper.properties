# Gradle wrapper pinning for AGP 8.5.2 (requires Gradle 8.7+).
# Only the properties file is committed here: the binary gradle-wrapper.jar and
# the gradlew scripts cannot be generated without a JDK+Gradle, so run
#   gradle wrapper --gradle-version 8.7
# once (or open the project in Android Studio) and the wrapper becomes complete.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
